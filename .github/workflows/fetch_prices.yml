name: Hourly TCG Price Updater

on:
  schedule:
    # Runs automatically at minute 0 of every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub UI

jobs:
  run-updater:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install required packages
        run: |
          pip install aiohttp asyncpg

      - name: Execute price fetcher script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python update_prices.py
